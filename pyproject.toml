[project]
name = "ledgerx_pharmacy"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Pharmacy chains: batches and expiry, many branches with a central store, insurance and chronic patients, controlled drugs, smart purchasing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"
